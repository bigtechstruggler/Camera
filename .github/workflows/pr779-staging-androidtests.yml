name: PR779 staging - compile instrumentation tests

on:
  push:
    branches:
      - test/fold-779-nov-2026-upstream

jobs:
  compile-android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile device instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon
